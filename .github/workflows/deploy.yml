# Runs the tests, builds the report and the in-browser explorer, and publishes
# them to GitHub Pages. Pull requests get the tests and build only; pushes to
# main also deploy. Can be run by hand from the repo's Actions tab.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true  # prebuilt Linux binaries, much faster installs

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("ggplot2", "dplyr", "patchwork", "ggrepel",
            "scales", "knitr", "rmarkdown", "testthat", "Matrix", "shiny", "bslib",
            "shinylive"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Test and build the site
        run: Rscript build_site.R

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
